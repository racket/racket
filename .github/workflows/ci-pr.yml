name: CI Pull Request

on: [pull_request]

permissions:
  contents: read

jobs:

  buildtest-linux-x86:
    container:
      image: racket/racket-ci:latest
      options: --init

    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: make CPUS="$(nproc)" PKGS=""
    - name: Extend PATH with Racket executable
      run: echo "${GITHUB_WORKSPACE}/racket/bin" >> $GITHUB_PATH
    - name: Test
      run: bash .github/scripts/run-racket-tests.sh

  buildtest-macos:

    runs-on: macos-15

    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: make CPUS="$(sysctl -n hw.physicalcpu)" PKGS=""
    - name: Extend PATH with Racket executable
      run: echo "${GITHUB_WORKSPACE}/racket/bin" >> $GITHUB_PATH
    - name: Test
      run: bash .github/scripts/run-racket-tests.sh
    - name: Tarball
      run: tar -cvjf racketcs-macos-aarch64_git${{ github.sha }}.tar.bz2 racket
    - uses: actions/upload-artifact@v7
      with:
        name: racketcs-macos-aarch64_git${{ github.sha }}
        path: racketcs-macos-aarch64_git${{ github.sha }}.tar.bz2

  build-ios:
    runs-on: macos-15
    needs: buildtest-macos
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        name: racketcs-macos-aarch64_git${{ github.sha }}
        path: ${{ github.workspace }}
    - name: Untar host Racket
      run: |
        mkdir host-racket
        tar -xvjf racketcs-macos-aarch64_git${{ github.sha }}.tar.bz2 -C host-racket --strip-components 1
    - name: Build iOS Racket
      run: |
        set -euxo pipefail
        mkdir -p racket/src/build-ios
        pushd racket/src/build-ios
        ../configure \
          --host=aarch64-apple-darwin \
          --enable-ios=iPhoneOS \
          --enable-racket=${{ github.workspace }}/host-racket/bin/racket \
          --enable-scheme=${{ github.workspace }}/host-racket/src/build/cs/c
        make
        make install

  build-pb-ios:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v7
    - name: Build LibFFI
      run: |
        set -euxo pipefail
        curl -fsSL -O https://github.com/libffi/libffi/releases/download/v3.4.8/libffi-3.4.8.tar.gz
        tar -xzf libffi-3.4.8.tar.gz
        cd libffi-3.4.8
        ./configure \
          --host=aarch64-apple-ios \
          --prefix="${GITHUB_WORKSPACE}/libffi-ios" \
          --disable-shared \
          CC="xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=12.0"
        make
        make install
    - name: Build PB iOS Racket
      run: |
        set -euxo pipefail
        make fetch-pb
        mkdir -p racket/src/build
        cd racket/src/build
        env PKG_CONFIG_PATH="${GITHUB_WORKSPACE}/libffi-ios/lib/pkgconfig" \
          ../configure \
            --host=aarch64-apple-darwin \
            --enable-ios=iPhoneOS \
            --enable-pb \
            --enable-racket=auto \
            --enable-libffi
        make
        make install
